services:
  portal:
    image: nginx:alpine
    container_name: vmcv-portal
    # Kein Port-Publish: NPM erreicht vmcv-portal:80 ueber dockernet (Host-Port 80 gehoert NPM).
    volumes:
      # Website direkt gemountet: Aenderungen in public/ greifen sofort, kein Rebuild.
      - ./public:/usr/share/nginx/html:ro
      # nginx.conf: nach Aenderung `docker compose restart portal`
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount config directory - edit config/links.yaml to update the portal
      - ./config:/data/config:ro
      # Ergebnis des Linkchecks (nur status.json wird ausgeliefert, siehe nginx.conf)
      - ./data:/data/status:ro
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NGINX_HOST=${NGINX_HOST:-localhost}
    restart: unless-stopped
    depends_on: [php]
    # ponytail: liveness via /proc listen-socket (80=0050). no http client/auth/wget dep.
    healthcheck:
      test: ["CMD-SHELL", "awk '$4==\"0A\" && $2 ~ /:0050$/{f=1} END{exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [dockernet]
  php:
    image: php:8.3-fpm-alpine
    container_name: vmcv-portal-php
    volumes:
      - ./api:/var/www/api:ro
    # REPORT_TO (Empfaenger) nur hier, Datei ist gitignored. Vorlage: report.env.example
    env_file: report.env
    restart: unless-stopped
    networks: [dockernet]
  linkcheck:
    image: php:8.3-fpm-alpine
    container_name: vmcv-portal-linkcheck
    # ponytail: Schleife statt Cron, stuendlich reicht (kein Monitoring).
    command: ["sh", "-c", "while :; do php /app/check-links.php; sleep 3600; done"]
    volumes:
      - ./api:/app:ro
      - ./config:/config:ro
      - ./data:/data
    # Oeffentliches DNS wie bei Besuchern: das Host-DNS loest server.vmcv.at auf 127.0.1.1 auf,
    # im Container ins Leere (app.vmcv.at, lvs.vmcv.at waren sonst "nicht erreichbar").
    dns: [1.1.1.1, 9.9.9.9]
    restart: unless-stopped
    networks: [dockernet]
networks:
  dockernet:
    external: true
