server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Alle add_header nur hier auf Server-Ebene: ein add_header in einer location
    # wuerde diese hier fuer die location komplett verwerfen.

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://umami.server.vmcv.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.allorigins.win https://umami.server.vmcv.at;" always;

    # ponytail: Entwicklungsphase - nichts cachen, jede Aenderung in public/ ist sofort sichtbar.
    # Fuer Produktion spaeter Bilder/Fonts wieder cachen.
    add_header Cache-Control "no-store" always;

    # Serve static files (public/ ist read-only gemountet)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Meldeformular -> PHP-Container (api/report.php)
    location = /api/report {
        client_max_body_size 16k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/report.php;
        fastcgi_pass vmcv-portal-php:9000;
    }

    # YAML config file from mounted config directory
    location /links.yaml {
        alias /data/config/links.yaml;
        default_type text/yaml;
    }

    # Linkcheck-Ergebnis (data/status.json, stuendlich von vmcv-portal-linkcheck)
    location = /status.json {
        alias /data/status/status.json;
        default_type application/json;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
