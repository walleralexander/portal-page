<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <link rel="icon" id="favicon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="enhancements.css">
    <link rel="stylesheet" href="admin.css">
    <script src="vendor/js-yaml.min.js"></script>
    <script defer src="https://umami.server.vmcv.at/script.js" data-website-id="7b1046ee-baaf-46c3-8fb6-8a70e5ff8384"></script>
</head>
<body>
    <div class="container">
        <!-- Header with date/time and dark mode toggle -->
        <header class="header">
            <div class="header-left">
                <img id="site-logo" class="site-logo hidden" src="" alt="">
                <span id="site-name" class="site-name"></span>
            </div>
            <div class="header-right">
                <div class="datetime" id="datetime"></div>
                <a class="report-link" href="#report-title">Eintrag melden</a>
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                </button>
            </div>
        </header>

        <!-- Message Banner -->
        <div id="message-banner" class="message-banner">
            <span id="message-text"></span>
        </div>

        <div class="main-content">
            <!-- Links Section -->
            <div class="links-section">
                <div id="links-container"></div>
            </div>

            <!-- RSS Feed Section -->
            <div class="rss-section">
                <h2 class="rss-title">Latest News</h2>
                <div id="rss-container">
                    <p class="loading">Loading feed...</p>
                </div>
            </div>
        </div>

        <section class="report-section" aria-labelledby="report-title">
            <h2 id="report-title" class="report-title">Fehlenden oder falschen Eintrag melden</h2>
            <p class="report-description">Wenn ein Link fehlt oder nicht stimmt, kannst du hier eine kurze Meldung senden.</p>
            <form id="entry-report-form" class="report-form" novalidate>
                <div class="report-grid">
                    <div class="report-field">
                        <label for="report-type">Art der Meldung</label>
                        <select id="report-type" name="type" required>
                            <option value="falsch">Eintrag ist falsch</option>
                            <option value="fehlt">Eintrag fehlt</option>
                            <option value="anderes">Anderes Problem</option>
                        </select>
                    </div>
                    <div class="report-field">
                        <label for="report-url">Betroffener Link (optional)</label>
                        <input id="report-url" name="url" type="url" maxlength="500" placeholder="https://beispiel.at" autocomplete="url">
                    </div>
                </div>

                <div class="report-field">
                    <label for="report-details">Beschreibung</label>
                    <textarea id="report-details" name="details" rows="5" minlength="10" maxlength="1500" required placeholder="Was ist falsch oder welcher Eintrag fehlt?"></textarea>
                </div>

                <div class="report-field">
                    <label for="report-email">Deine E-Mail (optional, fuer Rueckfragen)</label>
                    <input id="report-email" name="email" type="email" maxlength="200" placeholder="name@beispiel.at" autocomplete="email">
                </div>

                <input id="report-honeypot" class="report-honeypot" type="text" name="website" autocomplete="off" tabindex="-1" aria-hidden="true">
                <input id="report-started-at" type="hidden" name="started_at" value="">

                <div class="report-actions">
                    <button type="submit" id="report-submit" class="report-submit-btn">Meldung senden</button>
                </div>
                <p id="report-status" class="report-status" aria-live="polite"></p>
            </form>
        </section>

        <footer class="site-footer">
            <a href="impressum.html">Impressum</a> · <a href="impressum.html#datenschutz">Datenschutz</a>
        </footer>
    </div>

    <script src="plugins/plugins.js"></script>
    <script src="app.js"></script>
    <script src="admin.js"></script>
    <script src="keyboard-shortcuts.js"></script>
    <script src="search-feature.js"></script>
    <script>
        // Keine PWA mehr: alte Service-Worker-Registrierungen und deren Caches entfernen.
        navigator.serviceWorker?.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        window.caches?.keys().then(keys => keys.forEach(k => caches.delete(k)));
    </script>
</body>
</html>
