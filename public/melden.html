<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eintrag melden · VMCV Portal</title>
    <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script>
        // Gleiche Theme-Wahl wie die Startseite (nur lesen)
        try {
            const t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch {}
    </script>
    <script defer src="https://umami.server.vmcv.at/script.js" data-website-id="7b1046ee-baaf-46c3-8fb6-8a70e5ff8384"></script>
</head>
<body>
    <div class="container">
        <p class="legal-back"><a href="/">&larr; Zurück zum Portal</a></p>

        <section class="report-section" aria-labelledby="report-title">
            <h1 id="report-title" class="report-title">Fehlenden oder falschen Eintrag melden</h1>
            <p class="report-description">Wenn ein Link fehlt, nicht stimmt oder nicht funktioniert, kannst du hier eine kurze Meldung senden.</p>
            <form id="entry-report-form" class="report-form" novalidate>
                <div class="report-grid">
                    <div class="report-field">
                        <label for="report-type">Art der Meldung</label>
                        <select id="report-type" name="type" required>
                            <option value="falsch">Eintrag ist falsch</option>
                            <option value="fehlt">Eintrag fehlt</option>
                            <option value="anderes">Anderes Problem</option>
                        </select>
                    </div>
                    <div class="report-field">
                        <label for="report-url">Betroffener Link (optional)</label>
                        <input id="report-url" name="url" type="url" maxlength="500" placeholder="https://beispiel.at" autocomplete="url">
                    </div>
                </div>

                <div class="report-field">
                    <label for="report-details">Beschreibung</label>
                    <textarea id="report-details" name="details" rows="5" minlength="10" maxlength="1500" required placeholder="Was ist falsch oder welcher Eintrag fehlt?"></textarea>
                </div>

                <div class="report-field">
                    <label for="report-email">Deine E-Mail (optional, fuer Rueckfragen)</label>
                    <input id="report-email" name="email" type="email" maxlength="200" placeholder="name@beispiel.at" autocomplete="email">
                </div>

                <input id="report-honeypot" class="report-honeypot" type="text" name="website" autocomplete="off" tabindex="-1" aria-hidden="true">
                <input id="report-started-at" type="hidden" name="started_at" value="">

                <div class="report-actions">
                    <button type="submit" id="report-submit" class="report-submit-btn">Meldung senden</button>
                </div>
                <p id="report-status" class="report-status" aria-live="polite"></p>
            </form>
        </section>

        <footer class="site-footer">
            <a href="impressum.html">Impressum</a> · <a href="impressum.html#datenschutz">Datenschutz</a>
        </footer>
    </div>
    <script src="report.js"></script>
</body>
</html>
